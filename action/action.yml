name: Reflect
description: Check a Reflect instance and record hand-written changes in its memory.
inputs:
  github-token:
    description: A token that can push to the instance repository (github.token with contents write).
    required: true
runs:
  using: composite
  steps:
    - name: Refuse a public repository
      shell: bash
      run: |
        if [ "${{ github.event.repository.private }}" != "true" ]; then
          echo "::error::This Reflect instance is in a public repository. Make it private; the reader will not run here."
          exit 1
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Check
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../packages/cli/reflect.ts" check
    - name: Record hand-written changes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        reflect() { node "$GITHUB_ACTION_PATH/../packages/cli/reflect.ts" "$@"; }
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        reflect check --adopt
        git add -A -- . ":!.github"
        if ! git diff --cached --quiet; then
          git commit -m "Record hand-written changes"
          git push origin HEAD:${{ github.ref_name }}
        fi
