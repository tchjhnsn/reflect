# Written by `reflect init`. Checks the vault and records hand-written changes in its memory.
name: reflect
on:
  push:
    branches: [main]
    paths-ignore: [".github/**", ".obsidian/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: reflect
jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: tchjhnsn/reflect/action@main
        with:
          github-token: ${{ github.token }}
